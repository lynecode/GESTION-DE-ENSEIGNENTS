<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes heures - TimeEduc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/enseignants.css">
</head>
<body>

    <header class="header-modern">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-clock"></i>
                <span>TimeEduc</span>
            </div>
        </div>
        <div class="header-center">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="filtrerHeures()">
            </div>
        </div>
        <div class="header-right">
            <button class="notification-btn">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">0</span>
            </button>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?background=1a2a4a&color=f0c027&name=ENS" alt="Avatar" class="user-avatar">
                <div class="user-info">
                    <span class="user-name" id="userName">Enseignant</span>
                    <span class="user-role">Enseignant</span>
                </div>
                <button class="btn-logout" onclick="deconnexion()" title="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navBar">
        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </button>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Mon tableau de bord</span>
            </a>
            <a href="mes-heures.html" class="nav-item active">
                <i class="fas fa-clock"></i>
                <span>Mes heures</span>
            </a>
            <a href="mon-recapitulatif.html" class="nav-item">
                <i class="fas fa-file-alt"></i>
                <span>Mon récapitulatif</span>
            </a>
        </div>
    </div>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-clock"></i> Mes heures effectuées</h1>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Matière</th>
                        <th>Type</th>
                        <th>Durée</th>
                        <th>Salle</th>
                        <th>Observations</th>
                    </tr>
                </thead>
                <tbody id="heuresBody"></tbody>
            </table>
        </div>
    </main>

    <script src="../../js/mes-heures.js"></script>
</body>
</html>
