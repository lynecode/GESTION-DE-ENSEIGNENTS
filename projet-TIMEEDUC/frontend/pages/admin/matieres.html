<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des matières - TimeEduc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/enseignants.css">
</head>
<body>

    <header class="header-modern">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-clock"></i>
                <span>TimeEduc</span>
            </div>
        </div>
        <div class="header-center">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher une matière..." onkeyup="filtrerMatieres()">
            </div>
        </div>
        <div class="header-right">
            <button class="notification-btn">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">0</span>
            </button>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?background=1a2a4a&color=f0c027&name=Admin" alt="Avatar" class="user-avatar">
                <div class="user-info">
                    <span class="user-name" id="userName">Administrateur</span>
                    <span class="user-role">Admin</span>
                </div>
                <button class="btn-logout" onclick="deconnexion()" title="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navBar">
        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </button>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Tableau de bord</span>
            </a>
            <a href="enseignants.html" class="nav-item">
                <i class="fas fa-chalkboard-teacher"></i>
                <span>Enseignants</span>
            </a>
            <a href="matieres.html" class="nav-item active">
                <i class="fas fa-book"></i>
                <span>Matières</span>
            </a>
            <a href="stats.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Statistiques</span>
            </a>
            <a href="exports.html" class="nav-item">
                <i class="fas fa-file-export"></i>
                <span>Exports</span>
            </a>
            <a href="parametres.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Paramètres</span>
            </a>
            <a href="admin-create.html" class="nav-item">
                <i class="fas fa-user-plus"></i>
                <span>Création admin</span>
            </a>
        </div>
    </div>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-book"></i> Gestion des matières</h1>
            <button class="btn-primary" onclick="openModal()">
                <i class="fas fa-plus"></i> Ajouter une matière
            </button>
        </div>

        <div class="table-container">
            <table id="matieresTable">
                <thead>
                    <tr>
                        <th>Intitulé</th>
                        <th>Filière</th>
                        <th>Niveau</th>
                        <th>Volume horaire prévu</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="matieresBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal Ajout / Modification -->
    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-book-medical"></i> Ajouter une matière</h2>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <form id="matiereForm" onsubmit="sauvegarderMatiere(event)">
                <input type="hidden" id="matiereId">
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-book"></i> Intitulé</label>
                        <input type="text" id="intitule" placeholder="Ex: Mathématiques" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> Filière</label>
                        <input type="text" id="filiere" placeholder="Ex: Informatique" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-layer-group"></i> Niveau</label>
                        <select id="niveau" required>
                            <option value="">Sélectionner</option>
                            <option>L1</option>
                            <option>L2</option>
                            <option>L3</option>
                            <option>M1</option>
                            <option>M2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Volume horaire prévu (h)</label>
                        <input type="number" id="volume_horaire_prevu" placeholder="Ex: 60" min="0" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/matieres.js"></script>
</body>
</html>
