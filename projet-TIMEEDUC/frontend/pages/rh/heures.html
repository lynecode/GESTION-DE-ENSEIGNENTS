<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisie des heures - TimeEduc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/enseignants.css">
</head>
<body>

    <header class="header-modern">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-clock"></i>
                <span>TimeEduc</span>
            </div>
        </div>
        <div class="header-center">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="filtrerHeures()">
            </div>
        </div>
        <div class="header-right">
            <button class="notification-btn">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">0</span>
            </button>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?background=1a2a4a&color=f0c027&name=RH" alt="Avatar" class="user-avatar">
                <div class="user-info">
                    <span class="user-name" id="userName">RH</span>
                    <span class="user-role">Ressources Humaines</span>
                </div>
                <button class="btn-logout" onclick="deconnexion()" title="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navBar">
        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </button>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Tableau de bord</span>
            </a>
            <a href="heures.html" class="nav-item active">
                <i class="fas fa-clock"></i>
                <span>Saisie heures</span>
            </a>
            <a href="paiements.html" class="nav-item">
                <i class="fas fa-money-bill-wave"></i>
                <span>Paiements</span>
            </a>
            <a href="statistiques.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Statistiques</span>
            </a>
            <a href="exports.html" class="nav-item">
                <i class="fas fa-file-export"></i>
                <span>Exports</span>
            </a>
        </div>
    </div>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-clock"></i> Saisie des heures effectuées</h1>
            <button class="btn-primary" onclick="openModal()">
                <i class="fas fa-plus"></i> Ajouter une heure
            </button>
        </div>

        <div class="table-container">
            <table id="heuresTable">
                <thead>
                    <tr>
                        <th>Enseignant</th>
                        <th>Matière</th>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Durée</th>
                        <th>Statut heure</th>
                        <th>Salle</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="heuresBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal Ajout / Modification -->
    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-calendar-plus"></i> Ajouter une heure</h2>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <form id="heureForm" onsubmit="sauvegarderHeure(event)">
                <input type="hidden" id="heureId">
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-chalkboard-teacher"></i> Enseignant</label>
                        <select id="enseignant_id" required>
                            <option value="">Sélectionner</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-book"></i> Matière</label>
                        <select id="matiere_id" required>
                            <option value="">Sélectionner</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> Date du cours</label>
                        <input type="date" id="date_cours" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Type d'heure</label>
                        <select id="type_heure" required>
                            <option value="">Sélectionner</option>
                            <option>CM</option>
                            <option>TD</option>
                            <option>TP</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-hourglass-half"></i> Durée (heures)</label>
                        <input type="number" id="duree" placeholder="Ex: 2" min="0.5" step="0.5" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-door-open"></i> Salle</label>
                        <input type="text" id="salle" placeholder="Ex: Salle A101">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label><i class="fas fa-comment"></i> Observations</label>
                        <input type="text" id="observations" placeholder="Observations éventuelles">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/heures.js"></script>
</body>
</html>
