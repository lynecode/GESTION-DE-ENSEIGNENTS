<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>États de paiement - TimeEduc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/enseignants.css">
</head>
<body>

    <header class="header-modern">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-clock"></i>
                <span>TimeEduc</span>
            </div>
        </div>
        <div class="header-center">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher un enseignant..." onkeyup="filtrerPaiements()">
            </div>
        </div>
        <div class="header-right">
            <button class="notification-btn">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">0</span>
            </button>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?background=1a2a4a&color=f0c027&name=RH" alt="Avatar" class="user-avatar">
                <div class="user-info">
                    <span class="user-name" id="userName">RH</span>
                    <span class="user-role">Ressources Humaines</span>
                </div>
                <button class="btn-logout" onclick="deconnexion()" title="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navBar">
        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </button>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Tableau de bord</span>
            </a>
            <a href="heures.html" class="nav-item">
                <i class="fas fa-clock"></i>
                <span>Saisie heures</span>
            </a>
            <a href="paiements.html" class="nav-item active">
                <i class="fas fa-money-bill-wave"></i>
                <span>Paiements</span>
            </a>
            <a href="statistiques.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Statistiques</span>
            </a>
            <a href="exports.html" class="nav-item">
                <i class="fas fa-file-export"></i>
                <span>Exports</span>
            </a>
        </div>
    </div>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-money-bill-wave"></i> États de paiement</h1>
            <button class="btn-primary" onclick="imprimerEtat()">
                <i class="fas fa-print"></i> Imprimer
            </button>
        </div>

        <div class="table-container">
            <table id="paiementsTable">
                <thead>
                    <tr>
                        <th>Enseignant</th>
                        <th>Grade</th>
                        <th>Département</th>
                        <th>Total heures</th>
                        <th>H. contractuelles</th>
                        <th>H. complémentaires</th>
                        <th>Taux horaire</th>
                        <th>Montant total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="paiementsBody"></tbody>
            </table>
        </div>

        <!-- Total général -->
        <div style="background:white;border-radius:15px;padding:20px;margin-top:20px;box-shadow:0 2px 15px rgba(0,0,0,0.05);display:flex;justify-content:flex-end;align-items:center;gap:20px;">
            <span style="color:#888;font-size:1rem;">Montant total général :</span>
            <span id="montantGeneral" style="color:#2e7d32;font-weight:700;font-size:1.5rem;">0 FCFA</span>
        </div>
    </main>

    <!-- Modal détails paiement -->
    <div id="modalDetails" class="modal hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h2><i class="fas fa-file-invoice-dollar"></i> Fiche de paiement</h2>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="detailsPaiement" style="padding:25px;"></div>
        </div>
    </div>

    <script src="../../js/paiements.js"></script>
</body>
</html>
