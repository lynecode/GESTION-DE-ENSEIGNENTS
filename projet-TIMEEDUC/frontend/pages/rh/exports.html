<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exports - TimeEduc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/enseignants.css">
</head>
<body>

    <header class="header-modern">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-clock"></i>
                <span>TimeEduc</span>
            </div>
        </div>
        <div class="header-right">
            <button class="notification-btn">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">0</span>
            </button>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?background=1a2a4a&color=f0c027&name=RH" alt="Avatar" class="user-avatar">
                <div class="user-info">
                    <span class="user-name" id="userName">RH</span>
                    <span class="user-role">Ressources Humaines</span>
                </div>
                <button class="btn-logout" onclick="deconnexion()" title="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="nav-bar" id="navBar">
        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </button>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Tableau de bord</span>
            </a>
            <a href="heures.html" class="nav-item">
                <i class="fas fa-clock"></i>
                <span>Saisie heures</span>
            </a>
            <a href="paiements.html" class="nav-item">
                <i class="fas fa-money-bill-wave"></i>
                <span>Paiements</span>
            </a>
            <a href="statistiques.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Statistiques</span>
            </a>
            <a href="exports.html" class="nav-item active">
                <i class="fas fa-file-export"></i>
                <span>Exports</span>
            </a>
        </div>
    </div>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-file-export"></i> Exports</h1>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:25px;">

            <!-- Export Excel -->
            <div style="background:white;border-radius:15px;padding:30px;box-shadow:0 2px 15px rgba(0,0,0,0.05);text-align:center;">
                <div style="width:80px;height:80px;background:#e8f5e9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
                    <i class="fas fa-file-excel" style="font-size:2rem;color:#27ae60;"></i>
                </div>
                <h3 style="color:#1a2a4a;margin-bottom:10px;">Export Excel</h3>
                <p style="color:#888;font-size:0.9rem;margin-bottom:25px;">
                    Télécharger l'état global des heures de tous les enseignants au format Excel.
                </p>
                <button class="btn-primary" onclick="exporterExcel()" style="background:#27ae60;">
                    <i class="fas fa-download"></i> Télécharger Excel
                </button>
            </div>

            <!-- Export PDF -->
            <div style="background:white;border-radius:15px;padding:30px;box-shadow:0 2px 15px rgba(0,0,0,0.05);text-align:center;">
                <div style="width:80px;height:80px;background:#ffebee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
                    <i class="fas fa-file-pdf" style="font-size:2rem;color:#e74c3c;"></i>
                </div>
                <h3 style="color:#1a2a4a;margin-bottom:10px;">Export PDF</h3>
                <p style="color:#888;font-size:0.9rem;margin-bottom:25px;">
                    Télécharger l'état global des heures de tous les enseignants au format PDF.
                </p>
                <button class="btn-primary" onclick="exporterPDF()" style="background:#e74c3c;">
                    <i class="fas fa-download"></i> Télécharger PDF
                </button>
            </div>

        </div>
    </main>

    <script src="../../js/exports-rh.js"></script>
</body>
</html>
